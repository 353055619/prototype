<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #111110;
    --bg-subtle: #191918;
    --surface: #1e1e1d;
    --surface-raised: #252524;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --accent: #c89b6c;
    --accent-dim: rgba(200,155,108,0.15);
    --text: #e8e6e3;
    --text-secondary: rgba(232,230,227,0.6);
    --text-tertiary: rgba(232,230,227,0.32);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.3);
    --shadow-drag: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1.5px var(--accent);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
    --font-sans: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "JetBrains Mono", "Cascadia Code", monospace;
    --note-bg: #2a2520;
    --note-border: rgba(200,155,108,0.2);
    --transition-fast: 120ms cubic-bezier(0.25, 0.1, 0.25, 1);
    --transition-normal: 200ms cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-sans);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 512px 512px;
    mix-blend-mode: overlay;
  }

  /* ===== canvas viewport ===== */
  .canvas-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
  }
  .canvas-viewport.panning { cursor: grabbing; }

  .canvas-world {
    position: absolute;
    left: 0; top: 0;
    width: 20000px; height: 20000px;
    transform-origin: 0 0;
    will-change: transform;
  }

  /* ===== dot grid ===== */
  .canvas-viewport {
    --grid-color: rgba(255,255,255,0.04);
  }

  /* ===== draggable elements ===== */
  .canvas-el {
    position: absolute;
    cursor: grab;
    transition: box-shadow var(--transition-normal), transform var(--transition-fast);
  }
  .canvas-el:hover { z-index: 10; }
  .canvas-el.dragging {
    cursor: grabbing;
    z-index: 999;
    box-shadow: var(--shadow-drag) !important;
    transform: scale(1.01);
    transition: none;
  }

  /* ===== section header ===== */
  .section-header {
    position: absolute;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 16px;
    white-space: nowrap;
  }
  .section-header .section-num {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--accent);
    opacity: 0.8;
  }
  .section-header .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .section-header .section-line {
    flex: none;
    width: 48px;
    height: 1px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
    opacity: 0.3;
  }

  /* ===== title ===== */
  .canvas-title {
    position: absolute;
    pointer-events: none;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.025em;
    color: var(--text);
  }

  /* ===== text block ===== */
  .canvas-text {
    position: absolute;
    line-height: 1.7;
    letter-spacing: 0.005em;
    color: var(--text-secondary);
    min-width: 200px;
    max-width: 560px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ===== tag ===== */
  .canvas-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: border-color var(--transition-fast), background var(--transition-fast);
    white-space: nowrap;
  }
  .canvas-tag:hover {
    border-color: var(--border-hover);
    background: var(--surface-raised);
  }
  .canvas-tag .tag-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  /* ===== context card ===== */
  .context-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    min-width: 220px;
    transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
  }
  .context-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
  }
  .context-card .card-head {
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .context-card .card-head .head-indicator {
    width: 3px;
    height: 16px;
    border-radius: 2px;
    background: var(--accent);
    flex-shrink: 0;
  }
  .context-card .card-head h3 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text);
  }
  .context-card .card-content {
    padding: 0 20px 20px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-secondary);
  }
  .context-card .card-content ul {
    list-style: none;
    padding: 0;
  }
  .context-card .card-content li {
    padding: 4px 0;
    padding-left: 12px;
    position: relative;
  }
  .context-card .card-content li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 11px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text-tertiary);
  }

  /* ===== design system card ===== */
  .ds-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
  }
  .ds-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
  }
  .ds-card .ds-head {
    padding: 16px 20px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .ds-card .ds-body {
    padding: 0 20px 20px;
  }

  /* color type */
  .ds-card .color-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
    gap: 8px;
  }
  .ds-card .color-chip {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    position: relative;
    transition: transform var(--transition-fast);
  }
  .ds-card .color-chip:hover { transform: scale(1.08); }
  .ds-card .color-chip .chip-label {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    white-space: nowrap;
  }

  /* typography type */
  .ds-card .type-stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .ds-card .type-row {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .ds-card .type-label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    min-width: 36px;
    flex-shrink: 0;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .ds-card .type-sample {
    color: var(--text);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ===== color swatch (standalone) ===== */
  .color-swatch-group {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 20px;
  }
  .swatch-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .swatch-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: transform var(--transition-fast), box-shadow var(--transition-fast);
  }
  .swatch-circle:hover {
    transform: scale(1.1);
    box-shadow: var(--shadow-md);
  }
  .swatch-name {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-secondary);
    text-align: center;
  }
  .swatch-hex {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    text-align: center;
  }

  /* ===== type sample (standalone) ===== */
  .type-sample-group {
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-width: 400px;
  }
  .type-sample-row {
    display: flex;
    align-items: baseline;
    gap: 20px;
  }
  .type-sample-meta {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    min-width: 48px;
    flex-shrink: 0;
    letter-spacing: 0.04em;
  }
  .type-sample-text {
    color: var(--text);
    line-height: 1.25;
  }

  /* ===== note (sticky) ===== */
  .canvas-note {
    background: var(--note-bg);
    border: 1px solid var(--note-border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    min-width: 200px;
    max-width: 300px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow var(--transition-normal), transform var(--transition-fast);
  }
  .canvas-note:hover {
    box-shadow: var(--shadow-md);
  }
  .canvas-note .note-tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.7;
    margin-bottom: 8px;
  }
  .canvas-note .note-body {
    font-size: 13px;
    line-height: 1.65;
    color: var(--text-secondary);
  }

  /* ===== design page ===== */
  .design-page {
    background: #fff;
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    transition: box-shadow var(--transition-normal);
  }
  .design-page:hover {
    box-shadow: 0 16px 56px rgba(0,0,0,0.5), 0 6px 16px rgba(0,0,0,0.35);
  }
  .design-page .page-content div, .design-page .page-content span, .design-page .page-content label, .diagram-content div, .diagram-content span { line-height: 1.55; }
.page-content {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .page-label {
    position: absolute;
    bottom: -32px;
    left: 0;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-tertiary);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .page-label .label-num {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent);
    opacity: 0.6;
  }

  /* ===== diagram ===== */
  .canvas-diagram {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .canvas-diagram .diagram-content {
    width: 100%;
    height: 100%;
    padding: 20px;
  }

  /* ===== zoom controls ===== */
  .zoom-controls {
    position: fixed;
    bottom: 24px; right: 24px;
    display: flex;
    align-items: center;
    gap: 1px;
    z-index: 100;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .zoom-btn {
    width: 36px; height: 36px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition-fast), color var(--transition-fast);
  }
  .zoom-btn:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text);
  }
  .zoom-btn:active {
    background: rgba(255,255,255,0.03);
  }
  .zoom-label {
    min-width: 50px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-tertiary);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* ===== coord indicator ===== */
  .coord-indicator {
    position: fixed;
    bottom: 28px; left: 24px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--text-tertiary);
    z-index: 100;
    padding: 4px 10px;
    background: rgba(17,17,16,0.85);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  /* ===== keyboard hint ===== */
  .kbd-hint {
    position: fixed;
    top: 20px; right: 24px;
    z-index: 100;
    font-size: 10px;
    color: var(--text-tertiary);
    display: flex;
    gap: 12px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .canvas-viewport:hover ~ .kbd-hint { opacity: 1; }
  .kbd-hint kbd {
    font-family: var(--font-mono);
    padding: 2px 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 10px;
  }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  .design-page .page-content { color: #17181C; }
</style>
</head>
<body>

<div class="canvas-viewport" id="viewport">
  <div class="canvas-world" id="world"></div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" id="zoomOut" aria-label="">&#8722;</button>
  <div class="zoom-label" id="zoomLabel">100%</div>
  <button class="zoom-btn" id="zoomIn" aria-label="">+</button>
  <button class="zoom-btn" id="zoomReset" title="" aria-label="">&#8962;</button>
</div>

<div class="coord-indicator" id="coordIndicator">0, 0</div>

<div class="kbd-hint" id="kbdHint"></div>

<script>
(() => {
  // ═══════════════════════════════════════════════════════════
  // LOCALIZE: instantiating agent MUST translate every value in
  // UI_STRINGS to the user's conversation language. Machine fields
  // (id/class/data-*) remain English.
  // ═══════════════════════════════════════════════════════════
  const UI_STRINGS = {
    projectDescription: '华为 ICT 学院合作 · 高校注册认证电子流。\n高校接口人注册账号并提交授权书获得资格后发起认证：白名单高校直选，非白名单由管理员单独审核（不入白名单）；华为侧分配多人评审与终审，驳回逐级回退。',
    tags: ['5 个角色视角', 'PC 桌面端门户', '双驳回回退分支', '白名单 + 审计日志'],
    contextCards: {
      coreFeatures: { title: '角色与职责', items: ['高校接口人：资格申请、发起认证', '华为侧接口人：资格审核、分配评审/审核', '评审人（多人）：逐人给意见', '审核人：终审通过或驳回', '系统管理员：白名单录入与审计'] },
      techHighlights: { title: '关键业务规则', items: ['白名单源自政府公布名单，录入留审计', '非白名单高校可手输，管理员审核不回填', '评审驳回 → 退回申请阶段', '审核驳回 → 退回评审前重新评审', '审核通过 → 高校注册成功'] },
      deliveryStandards: { title: '交付物', items: ['可交互原型（单文件 HTML）', '无限画布设计稿（本文件）', '状态机驱动真实流转', '全程演示数据标注'] },
    },
    notes: {
      designPhilosophy: { tag: '设计说明', body: '品牌事实色取华为红 #C7000B，中性灰企业基底；系统字体栈（苹方 / Helvetica），单屏强调色不超过两处。' },
      remark: { tag: '备注', body: 'Row 3 九屏按实际操作链路排列；打开「可交互原型」可点通全部流程与驳回分支。' },
    },
    typeSamples: {
      heading: '高校注册认证',
      subheading: '电子流 · 多角色协作',
      bodyText: '设计是把业务意图变成可感知形式的过程。',
      caption: '辅助说明与时间戳',
    },
    pages: {
      login: { label: '① 登录 / 注册' },
      liaison: { label: '② 接口人资格申请' },
      workbench: { label: '③ 接口人工作台' },
      certform: { label: '④ 高校认证表单' },
      assign: { label: '⑤ 华为侧分配' },
      review: { label: '⑥ 多人评审' },
      approve: { label: '⑦ 终审' },
      done: { label: '⑧ 注册成功' },
      admin: { label: '⑨ 管理员 · 白名单' },
    },
    docTitle: '高校认证电子流 · 无限画布',
    zoom: { zoomIn: '放大', zoomOut: '缩小', reset: '重置视图' },
    kbdHints: [['滚动', '平移'], ['Ctrl / ⌘ + 滚动', '缩放'], ['Ctrl / ⌘ + Z', '撤销']],
    sections: { context: '01 · 项目背景', designSystem: '02 · 设计系统', deliverables: '03 · 设计稿（按操作链路排列）' },
    demoTitle: '高校注册认证电子流',
    designSystemCards: {
      colorTitle: '色板',
      typographyTitle: '字体排印',
      componentsTitle: '组件',
      swatchNames: ['品牌红', '深红（文字）', '背景', '卡片面', '正文', '边框'],
      typeMeta: { h1: 'H1', h2: 'H2', body: 'Body', caption: 'Caption' },
      componentSamples: { primary: '主按钮', secondary: '次按钮', inputPlaceholder: '输入框占位…' },
    },
    hello: 'ICT 学院',
  };

  // Chrome strings live in UI_STRINGS too — applied here so the static HTML
  // above carries no visible copy at all (machine-checkable invariant).
  document.title = UI_STRINGS.docTitle;
  document.getElementById('zoomIn').setAttribute('aria-label', UI_STRINGS.zoom.zoomIn);
  document.getElementById('zoomOut').setAttribute('aria-label', UI_STRINGS.zoom.zoomOut);
  document.getElementById('zoomReset').setAttribute('aria-label', UI_STRINGS.zoom.reset);
  document.getElementById('kbdHint').innerHTML = UI_STRINGS.kbdHints
    .map(([keys, action]) => `<span><kbd>${keys}</kbd> ${action}</span>`)
    .join('');

  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const zoomLabel = document.getElementById('zoomLabel');
  const coordIndicator = document.getElementById('coordIndicator');

  /* ===== canvas state ===== */
  let panX = 0, panY = 0, zoom = 1;
  const MIN_ZOOM = 0.05, MAX_ZOOM = 8;

  function updateTransform() {
    world.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    updateGrid();
  }

  /* ===== dot grid ===== */
  function updateGrid() {
    const g = 40 * zoom;
    const ox = panX % g, oy = panY % g;
    viewport.style.backgroundImage = `radial-gradient(circle, var(--grid-color) 0.8px, transparent 0.8px)`;
    viewport.style.backgroundSize = `${g}px ${g}px`;
    viewport.style.backgroundPosition = `${ox}px ${oy}px`;
  }

  /* ===== panning ===== */
  let isPanning = false, panSX, panSY;

  viewport.addEventListener('pointerdown', (e) => {
    if (e.target === viewport || e.target === world) {
      isPanning = true;
      panSX = e.clientX - panX;
      panSY = e.clientY - panY;
      viewport.classList.add('panning');
      viewport.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!isPanning) return;
    panX = e.clientX - panSX;
    panY = e.clientY - panSY;
    updateTransform();
  });
  viewport.addEventListener('pointerup', () => {
    isPanning = false;
    viewport.classList.remove('panning');
  });

  /* ===== wheel: trackpad scroll = pan, pinch/ctrl+scroll = zoom ===== */
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();

    if (e.ctrlKey || e.metaKey) {
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      const factor = e.deltaY > 0 ? 0.95 : 1.05;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    } else {
      const hasX = Math.abs(e.deltaX) > 0.5;
      if (hasX || Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.3) {
        panX -= e.deltaX;
        panY -= e.deltaY;
      } else {
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
        const factor = e.deltaY > 0 ? 0.95 : 1.05;
        zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
        panX = mx - wx * zoom;
        panY = my - wy * zoom;
      }
    }
    updateTransform();
  }, { passive: false });

  /* ===== zoom buttons ===== */
  function zoomAt(factor) {
    const r = viewport.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    panX = cx - wx * zoom;
    panY = cy - wy * zoom;
    updateTransform();
  }
  document.getElementById('zoomIn').onclick = () => zoomAt(1.25);
  document.getElementById('zoomOut').onclick = () => zoomAt(0.8);
  document.getElementById('zoomReset').onclick = () => { zoom = 1; panX = 0; panY = 0; updateTransform(); };
  document.getElementById('zoomReset').title = UI_STRINGS.zoom.reset;

  /* ===== coord indicator ===== */
  viewport.addEventListener('pointermove', (e) => {
    if (isPanning) return;
    const r = viewport.getBoundingClientRect();
    coordIndicator.textContent = `${Math.round((e.clientX - r.left - panX) / zoom)}, ${Math.round((e.clientY - r.top - panY) / zoom)}`;
  });

  /* ===== touch gestures ===== */
  let lastPinchDist = null, lastPinchCenter = null;

  viewport.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const t0 = e.touches[0], t1 = e.touches[1];
      lastPinchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      lastPinchCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
      e.preventDefault();
    }
  }, { passive: false });

  viewport.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const center = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
    if (lastPinchDist > 0) {
      const r = viewport.getBoundingClientRect();
      const mx = center.x - r.left, my = center.y - r.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * Math.pow(dist / lastPinchDist, 0.6)));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    }
    if (lastPinchCenter) {
      panX += center.x - lastPinchCenter.x;
      panY += center.y - lastPinchCenter.y;
    }
    lastPinchDist = dist;
    lastPinchCenter = center;
    updateTransform();
  }, { passive: false });

  viewport.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) { lastPinchDist = null; lastPinchCenter = null; }
  });

  /* ===== undo ===== */
  const undoStack = [];
  function saveUndo() {
    const s = [];
    world.querySelectorAll('.canvas-el').forEach(el => {
      s.push({ id: el.id, left: el.style.left, top: el.style.top });
    });
    undoStack.push({ panX, panY, zoom, assets: s });
    if (undoStack.length > 60) undoStack.shift();
  }
  function undo() {
    if (!undoStack.length) return;
    const st = undoStack.pop();
    panX = st.panX; panY = st.panY; zoom = st.zoom;
    st.assets.forEach(a => {
      const el = document.getElementById(a.id);
      if (el) { el.style.left = a.left; el.style.top = a.top; }
    });
    updateTransform();
  }
  document.addEventListener('keydown', (e) => {
    if (e.target instanceof Element && e.target.closest('input, textarea, select, [contenteditable]')) return;
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  });

  /* ===== draggable ===== */
  function makeDraggable(el) {
    let dragging = false, sx, sy, ox, oy;
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || (e.target instanceof Element && e.target.closest('button, a, input, textarea, select, [contenteditable]'))) return;
      dragging = true;
      el.classList.add('dragging');
      saveUndo();
      sx = e.clientX; sy = e.clientY;
      ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
      el.setPointerCapture(e.pointerId);
      e.stopPropagation();
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      el.style.left = (ox + (e.clientX - sx) / zoom) + 'px';
      el.style.top = (oy + (e.clientY - sy) / zoom) + 'px';
    });
    el.addEventListener('pointerup', () => {
      if (dragging) { dragging = false; el.classList.remove('dragging'); }
    });
  }

  let _id = 0;

  /* ===== API: addSection ===== */
  function addSection(rowY, label) {

    el.innerHTML = `<span class="section-line"></span><span class="section-num">${num}</span><span class="section-label">${rest}</span>`;

              <div style="display:flex;background:#F4F5F7;color:#575B63;padding:7px 12px;font-weight:500;"><span style="flex:1.2;">高校名称</span><span style="flex:.8;">所在地</span><span style="flex:.8;">主管部门</span><span style="flex:.7;">录入时间</span></div>
              ${[['清华大学', '北京', '教育部'], ['浙江大学', '浙江杭州', '教育部'], ['华中科技大学', '湖北武汉', '教育部'], ['电子科技大学', '四川成都', '教育部'], ['南京邮电大学', '江苏南京', '省教育厅']].map(r => `<div style="display:flex;padding:6px 12px;border-top:1px solid #E2E4E9;"><span style="flex:1.2;font-weight:500;">${r[0]}</span><span style="flex:.8;color:#575B63;">${r[1]}</span><span style="flex:.8;color:#575B63;">${r[2]}</span><span style="flex:.7;color:#575B63;font-family:ui-monospace,Menlo,monospace;">11-22 09:1x</span></div>`).join('')}
            </div>
            <div style="flex:1;background:#fff;border:1px solid #E2E4E9;border-radius:8px;padding:14px 16px;">
              <div style="font-size:13px;font-weight:600;margin-bottom:4px;">录入白名单高校</div>
              <div style="font-size:12px;color:#575B63;margin-bottom:10px;">仅限教育主管部门公布的全国高校名单；重复录入会被拦截</div>
              ${field('高校全称 *', '')}
              ${field('所在地 *', '', '100%')}
              ${btnP}录入并记入审计日志</span>
            </div>
          </div>
        </div>
      </div>
    `);
  }

  initDemo();

  const r = viewport.getBoundingClientRect();
  panX = r.width * 0.04;
  panY = r.height * 0.04;
  updateTransform();
})();
</script>
